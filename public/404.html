<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Del Norte Navigator Routing Redirector</title>
    <script type="text/javascript">
      // Segment the current URL path components and store them safely
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        l.search.replace(/&/g, '~and~') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
